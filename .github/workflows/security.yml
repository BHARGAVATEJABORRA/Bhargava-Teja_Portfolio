name: Security verification
on:
  pull_request:
  push:
    branches: [main, portfolio-atmosphere-performance, 'codex/**']
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node scripts/prepare-content.mjs
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run test:security
      - run: npm run test:security:libsql
      - run: npm run build
      - run: npm run test:security:http
